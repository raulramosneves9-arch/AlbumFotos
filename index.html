<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Álbum de Fotos</title>

  <!-- Fontes bonitas do Google Fonts (precisa de internet para carregar) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Figtree:wght@400;500;600&display=swap">

  <!-- Aqui conectamos o arquivo de estilo (cores, fontes, tamanhos) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============ TOPO DA PÁGINA ============ -->
  <header>
    <!-- Coração em degradê. O "gradiente-coracao" também é usado pelos corações entre as fotos -->
    <svg class="coracao" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="gradiente-coracao" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b7bff" /> <!-- azul -->
          <stop offset="1" stop-color="#a24dff" /> <!-- roxo -->
        </linearGradient>
      </defs>
      <path fill="url(#gradiente-coracao)"
        d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 5 6 5c2.1 0 3.4 1.1 4.2 2.4.3.5.9.5 1.2 0C12.2 6.1 13.9 5 16 5c3.4 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z" />
    </svg>

    <!-- contenteditable: dá para clicar e trocar o título direto na página -->
    <h1 id="titulo" contenteditable="true" spellcheck="false">Álbum de Fotos</h1>

    <p class="frase">A cada lugar visitado, sua história fica registrada.</p>

    <div class="barra">
      <button class="botao-principal" id="botao-adicionar" disabled>Guardar um momento</button>
      <span class="contador" id="contador"></span>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Carregando álbum...</p>
  </header>

  <!-- ============ LISTA DE LEMBRANÇAS ============ -->
  <!-- Esta área começa vazia. O arquivo script.js preenche com as fotos. -->
  <main id="lista"></main>

  <!-- ============ JANELA PARA ADICIONAR / EDITAR ============ -->
  <dialog id="janela">
    <form id="formulario" method="dialog">
      <h2 class="titulo-janela" id="titulo-janela">Fotos Armazenadas</h2>

      <div class="linha">
        <label>Data
          <input type="date" id="campo-data" required>
        </label>
        <label>Local
          <input id="campo-local" placeholder="Onde vocês estavam? Ex.: Gramado" required maxlength="80">
        </label>
      </div>

      <label>Mini local
        <input id="campo-mini" placeholder="O cantinho exato. Ex.: o mirante, o café da esquina…" maxlength="80">
      </label>

      <label>Foto
        <input type="file" id="campo-foto" accept="image/*">
      </label>
      <img id="previa" alt="Pré-visualização da foto">

      <label>Nossa história desse dia
        <textarea id="campo-texto"
          placeholder="O que vocês viveram, riram e sentiram? Escreva o que não querem esquecer…"></textarea>
      </label>

      <p class="erro" id="erro" role="alert"></p>

      <div class="botoes">
        <button type="button" class="botao-secundario" id="botao-cancelar">Cancelar</button>
        <button type="submit" class="botao-principal">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Aqui conectamos o arquivo com a lógica (adicionar, editar, excluir) -->
  <script src="script.js"></script>
</body>

</html>
